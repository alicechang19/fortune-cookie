<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }

  canvas.ready { opacity: 1; }

  #hint.show { opacity: 1; transform: translate(-50%, 0); }

    left: auto; bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 18px;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 22px 10px; cursor: pointer; opacity: 0; pointer-events: none;
    transform: translate(0, -8px) scale(0.98);
    transition: opacity 0.32s cubic-bezier(.23,1,.32,1), transform 0.32s cubic-bezier(.23,1,.32,1),
                border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
  }
  #again.show { opacity: 1; pointer-events: auto; transform: translate(0, 0) scale(1); }
  #again:hover { border-color: rgba(88,56,30,0.45); background-color: rgba(88,56,30,0.05); color: var(--ink-strong); }
  #again:active { transform: translate(0, 1px) scale(0.96); transition-duration: 0.12s; }
  #again:focus-visible { outline: 1px solid rgba(88,56,30,0.6); outline-offset: 4px; }
  /* the hand emoji cursor (mouse and trackpad only) */
  .hand-cursor, .hand-cursor * { cursor: none !important; }
  #hand {
    position: fixed; left: 0; top: 0; width: 64px; height: 64px; z-index: 50; pointer-events: none; user-select: none;
    font: 54px/64px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; text-align: center;
    opacity: 0; transition: opacity 0.18s ease; will-change: transform;
    /* a white sticker outline, a thin dark edge and a soft shadow so the yellow hand reads on golden cookies */
    filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)
            drop-shadow(1px 1px 0 #fff) drop-shadow(-1px -1px 0 #fff)
            drop-shadow(0 0 1px rgba(70, 35, 10, 0.95)) drop-shadow(0 4px 6px rgba(50, 25, 8, 0.45));
  }
  #hand.on { opacity: 1; }
  #hand span { display: block; transition: scale 0.16s cubic-bezier(.3,1.5,.5,1); }
  #hand.down span { scale: 0.86; }
  #ring {
    position: fixed; left: 0; top: 0; width: 104px; height: 104px; margin: -52px 0 0 -52px; z-index: 49;
    pointer-events: none; opacity: 0; transition: opacity 0.3s ease; will-change: transform;
  }
  #ring circle { fill: none; stroke-width: 1.3; }
  #ring .track { stroke: rgba(88, 56, 30, 0.14); }
  #ring .fill { stroke: rgba(88, 56, 30, 0.7); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  @media (max-width: 520px) { .ui { font-size: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); } }
</style>

<body>
<div class="veil"></div>
<div class="grain"></div>
<div id="hint" class="ui"></div>
<div id="hand" aria-hidden="true"><span>✋</span></div>
<button id="again" class="ui" type="button">another cookie</button>
<svg id="ring" viewBox="0 0 76 76"><circle class="track" cx="38" cy="38" r="30"/><circle class="fill" cx="38" cy="38" r="30"/></svg>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V3 = THREE.Vector3;

const params = new URLSearchParams(location.search);
const AUTO = params.get('auto');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ utils */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

function hash2(x, y, s) {

function vnoise(x, y, s = 0) {

// a 1D spring helper
class Spring {

  step(dt) { const a = (this.target - this.x) * this.k - this.v * this.c; this.v += a * dt; this.x += this.v * dt; return this.x; }

/* ------------------------------------------------------------------ renderer / scene */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const BG = new THREE.Color('#ece1cd');
const scene = new THREE.Scene();
scene.background = BG;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.38;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 80);
const cam = {
  target: new V3(0, 0.95, 0), targetGoal: new V3(0, 0.95, 0),
  dir: new V3(0, 1.3, 1).normalize(), dirGoal: new V3(0, 1.3, 1).normalize(), dist: 7.4, distGoal: 7.4, baseDist: 7.4, pileDist: 10, view: 'pile',
  par: new V3(), kick: 0, kickT: 0,
};

// lights
const key = new THREE.SpotLight(0xfff1e0, 200, 0, THREE.MathUtils.degToRad(40), 0.8, 2);
key.position.set(-3.0, 9.2, 4.4);
key.target.position.set(0.15, 0.4, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 5; key.shadow.camera.far = 18;
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffd2a0, 1.1);
rim.position.set(3.5, 3.5, -6);
scene.add(rim);
const fillLight = new THREE.HemisphereLight(0xfff3e2, 0xb89870, 0.75);
scene.add(fillLight);
const glow = new THREE.PointLight(0xffa64a, 0, 3.2, 2);
scene.add(glow);

/* ------------------------------------------------------------------ textures */
function canvasTex(cv, srgb) {
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;

}
function makeCookieTextures() {

  const cream = [230, 186, 114], butter = [222, 173, 101], gold = [195, 143, 69], amber = [140, 89, 44];
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

      const u = x / N, v = y / N, dx = u * 2 - 1, dy = v * 2 - 1;
      const r = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
      const lo = fbm(u * 3, v * 3, 3, 1), mid = fbm(u * 11, v * 11, 3, 2), fine = fbm(u * 60, v * 60, 2, 4);
      // batter spreads from the centre: faint radial streaks

      bake += (mid - 0.5) * 0.25 + (lo - 0.5) * 0.3 + (streak - 0.5) * 0.06 * r;
      bake += Math.exp(-Math.pow(dy / 0.05, 2)) * 0.12;
      bake = clamp(bake, 0, 1.2);
      let c = mix(cream, butter, smooth(0.0, 0.4, bake));
      c = mix(c, gold, smooth(0.35, 0.8, bake));
      c = mix(c, amber, smooth(0.78, 1.15, bake));

      const o = (y * N + x) * 4;
      ci.data[o] = clamp(c[0] * k, 0, 255); ci.data[o + 1] = clamp(c[1] * k, 0, 255); ci.data[o + 2] = clamp(c[2] * k, 0, 255); ci.data[o + 3] = 255;

    const r = Math.hypot(x / N * 2 - 1, y / N * 2 - 1); if (r > 1.02) continue;

    g.addColorStop(0, 'rgba(0,0,0,0.3)'); g.addColorStop(0.6, 'rgba(0,0,0,0.1)'); g.addColorStop(0.8, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');

    g.addColorStop(0, 'rgba(255,236,190,0.1)'); g.addColorStop(0.75, `rgba(170,100,40,${0.04 + 0.06 * r})`); g.addColorStop(1, 'rgba(170,100,40,0)');

/* ------------------------------------------------------------------ floor */
const floorTex = makeFloorTexture();
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0xe7d7bd, roughness: 0.96, metalness: 0, bumpMap: floorTex, bumpScale: 0.06 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ------------------------------------------------------------------ cookie materials */
const cookieTex = makeCookieTextures();
const breakTex = makeBreakTextures();
const cookieMat = new THREE.MeshPhysicalMaterial({
  map: cookieTex.map, bumpMap: cookieTex.bump, bumpScale: 1.1, roughnessMap: cookieTex.rough, vertexColors: true,
  roughness: 1, metalness: 0, clearcoat: 0.18, clearcoatRoughness: 0.5, emissive: new THREE.Color(0x3a1a04), emissiveIntensity: 0.22,
  sheen: 0.6, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xffd89a),
});
const rimMat = cookieMat;
const breakMat = new THREE.MeshStandardMaterial({ map: breakTex.map, bumpMap: breakTex.bump, bumpScale: 3, roughness: 0.92, vertexColors: true, emissive: new THREE.Color(0x3a1a04), emissiveIntensity: 0.15 });
const cookieMats = [cookieMat, rimMat, breakMat];

/* ------------------------------------------------------------------ the Tripo cookie (assets/cookie.glb) */
// fortune cookie render.glb, decimated and cracked into two halves in Blender (fortune_cookie.blend).
// In the file: base on y = 0, the front crease dent faces +z, the halves meet near x = 0.
const MODEL_K = 1.15; // match the size the scene was tuned for
const breakMatT = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.95, 0.78, 0.52), map: breakTex.map, bumpMap: breakTex.bump, bumpScale: 3, roughness: 0.92, emissive: new THREE.Color(0x3a1a04), emissiveIntensity: 0.15 });
const TRIPO = await (async () => {
  const gltf = await new GLTFLoader().loadAsync('assets/cookie.glb');
  gltf.scene.updateMatrixWorld(true);
  let src = null;
  const half = (name, comFrom) => {
    const parts = [];
    gltf.scene.getObjectByName(name).traverse((o) => { if (o.isMesh) parts.push(o); });
    const ORDER = ['cookie', 'inside', 'break'];
    parts.sort((a, b) => ORDER.indexOf(a.material.name) - ORDER.indexOf(b.material.name));
    const geos = parts.map((m) => {
      if (m.material.name === 'cookie') src = m.material;
      const g = new THREE.BufferGeometry();
      for (const k of ['position', 'normal', 'uv']) g.setAttribute(k, m.geometry.attributes[k].clone());
      g.setIndex(m.geometry.index.clone());
      return g.applyMatrix4(m.matrixWorld).scale(MODEL_K, MODEL_K, MODEL_K);
    });

    const pos = geo.attributes.position, n = pos.count, com = new V3();
    for (let i = 0; i < n; i++) com.x += pos.getX(i), com.y += pos.getY(i), com.z += pos.getZ(i);
    com.multiplyScalar(1 / n);

    map: src.map, normalMap: src.normalMap, normalScale: src.normalScale.clone().multiplyScalar(1.2), roughnessMap: src.roughnessMap,
    roughness: 1, metalness: 0, clearcoat: 0.14, clearcoatRoughness: 0.5, sheen: 0.45, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xffd89a),
    color: new THREE.Color(1.0, 0.8, 0.54), emissive: new THREE.Color(0x3a1a04), emissiveIntensity: 0.1,

/* ------------------------------------------------------------------ cookie geometry */
// Shape ported from fortune_cookie.py (the Blender model): a dough disc is folded along a
// crease so both halves stack, then the crease is curled around a cup rim until its ends nearly
// meet. The layers hug at the crease, puff apart into a pocket, and are pressed shut at the seam,
// except for a slit where the fortune pokes out. The inner layer is dented by the cup rim.
const XE = 0.984;
function makeShapeParams() {
  return {
    bendR: (1 / 2.45) * rand(0.97, 1.03), // radius the crease is curled around

    // warm light leaking through the crack
    c.group.updateMatrixWorld();
    glow.position.copy(c.inner.localToWorld(c.center.clone()));
    glow.intensity = damp(glow.intensity, 2.6 * T * T, 10, rdt);
    // hint
    if (app.state === 'idle' && !app.pressing && T < 0.02) {
      app.idleT += rdt;
      if (app.idleT > (app.cracks ? 1.2 : 0.5)) showHint('hold to crack  ·  drag to turn', true);
    } else app.idleT = 0;
  }
}

function updateBodies(dt) {
  if (!app.bodies.length) return;
  acc += dt; let n = 0;
  if (grab.body) {
    ndc.set(pointer.nx, pointer.ny); raycaster.setFromCamera(ndc, camera);
    grab.plane.constant = -grab.planeY;
    if (raycaster.ray.intersectPlane(grab.plane, grab.target)) { grab.target.x = clamp(grab.target.x, -4, 4); grab.target.z = clamp(grab.target.z, -3, 2.5); }
  }
  while (acc >= SUB && n < 20) {
    if (grab.body) {
      const b = grab.body; b.wake(); b.inertia();
      _r.copy(grab.r).applyQuaternion(b.q);
      _vp.crossVectors(b.w, _r).add(b.v);
      _J.copy(grab.target).sub(b.p).sub(_r).multiplyScalar(160).addScaledVector(_vp, -15).multiplyScalar(SUB);
      _J.y += G * SUB * 0.6;
      b.impulse(_r, _J);
      b.w.multiplyScalar(1 - 3 * SUB);
    }
    for (const b of app.bodies) b.step(SUB, app.time);
    // keep the halves from interpenetrating (cheap)
    if (app.bodies.length === 2) {
      const [a, b] = app.bodies; _tmp.subVectors(a.p, b.p); _tmp.y = 0;
      const d = _tmp.length(), min = (a.radius + b.radius) * 0.48;
      if (d < min && d > 1e-4) { _tmp.multiplyScalar((min - d) / d * 0.5); a.p.add(_tmp); b.p.sub(_tmp); a.wake(); b.wake(); }
    }
    acc -= SUB; n++;
  }
}

function updateSlip(dt, rdt) {
  if (!slip.active) return;
  slip.t += dt;
  const t = slip.t;
  // where it wants to be: floating in front of the camera
  const aspect = camera.aspect, vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const toCam = _tmp2.copy(camera.position).sub(cam.target).normalize();
  if (!slip.leaving) {
    slip.target.copy(cam.target).addScaledVector(toCam, 2.0);
    slip.target.y += Math.sin(app.time * 1.1) * 0.03 * motion;
    const d = camera.position.distanceTo(slip.target);
    const fit = Math.min(1, (2 * d * vt * aspect * 0.86) / SW);
    slip.scale.target = fit;
    // spring towards target
    const k = 34, cd = 7.5;
    _tmp.subVectors(slip.target, slip.pos).multiplyScalar(k).addScaledVector(slip.vel, -cd);
    slip.vel.addScaledVector(_tmp, dt);
  } else {
    slip.vel.y += 9 * dt; slip.vel.multiplyScalar(1 - 0.5 * dt);
    slip.scale.target = 0; slip.curl.target = 0.8;
  }
  slip.pos.addScaledVector(slip.vel, dt);
  if (t > 0.22 && !slip.leaving) slip.curl.target = 0.035;
  if (t > 0.22 && !slip.rustled) { slip.rustled = true; Sound.rustle(0.6, 0.1); }
  slip.scale.step(dt); slip.curl.step(dt); slip.flip.step(dt);
  slip.wave = damp(slip.wave, 0.22, 1.4, dt);
  slipGroup.scale.setScalar(Math.max(0.0001, slip.scale.x));
  deformSlip(slip.curl.x, slip.wave * motion, app.time);
  // orientation: face camera, with flip + hover tilt + flutter
  _look.position.copy(slip.pos); _look.lookAt(camera.position);
  let hov = false;
  if (pointer.has && !slip.leaving && t > 0.6) hov = !!hitTest([slipFront, slipBack]);
  if (app.state === 'cracked' && !grab.body) setCursor(hov ? 'tap' : (hitTest(app.bodies.map((b) => b.mesh)) ? 'pickup' : 'open'));
  const px = pointer.has ? pointer.nx : 0, py = pointer.has ? pointer.ny : 0;
  slip.tilt.x = damp(slip.tilt.x, (hov ? 0.22 : 0.08) * -py * motion, 6, rdt);
  slip.tilt.y = damp(slip.tilt.y, (hov ? 0.3 : 0.1) * px * motion, 6, rdt);
  const fl = Math.exp(-t * 1.6) * motion;
  _e.set(slip.tilt.x + Math.sin(t * 9) * 0.25 * fl, slip.flip.x + slip.tilt.y + Math.sin(t * 7.3) * 0.35 * fl, Math.sin(t * 5.1) * 0.2 * fl + Math.sin(app.time * 0.7) * 0.015, 'XYZ');
  _qb.setFromEuler(_e);
  _qa.copy(_look.quaternion).multiply(_qb);
  slip.q.slerp(_qa, 1 - Math.exp(-dt * lerp(3, 10, smooth(0, 0.7, t))));
  if (slip.leaving && slip.scale.x < 0.02) { slip.active = false; slipGroup.visible = false; }
}

function updateCamera(rdt) {
  cam.target.lerp(cam.targetGoal, 1 - Math.exp(-rdt * 2.2));
  cam.dir.lerp(cam.dirGoal, 1 - Math.exp(-rdt * 2.4)).normalize();
  cam.dist = damp(cam.dist, cam.distGoal, 2.2, rdt);
  const px = pointer.has ? pointer.nx : 0, py = pointer.has ? pointer.ny : 0;
  cam.par.x = damp(cam.par.x, px * 0.45 * motion, 2.5, rdt);
  cam.par.y = damp(cam.par.y, py * 0.25 * motion, 2.5, rdt);
  cam.kick = Math.max(0, cam.kick - rdt * 2.6);
  const k = cam.kick * cam.kick * 0.07 * motion, tt = app.time * 40;
  camera.position.copy(cam.target).addScaledVector(cam.dir, cam.dist);
  camera.position.x += cam.par.x + Math.sin(tt) * k; camera.position.y += cam.par.y + Math.cos(tt * 1.3) * k;
  camera.lookAt(cam.target.x + Math.sin(tt * 0.7) * k * 0.3, cam.target.y, cam.target.z);
}

function updateRing(rdt) {
  const show = (app.pressing || app.tension > 0.03) && app.state === 'idle';
  ringEl.style.opacity = show ? '1' : '0';
  if (app.keyPress || !pointer.has) {
    const c = app.cookie;
    if (c) { const p = c.inner.localToWorld(c.center.clone()).project(camera); pointer.sx = (p.x + 1) / 2 * innerWidth; pointer.sy = (1 - p.y) / 2 * innerHeight; }
  } else { pointer.sx = damp(pointer.sx || pointer.x, pointer.x, 30, rdt); pointer.sy = damp(pointer.sy || pointer.y, pointer.y, 30, rdt); }
  const sc = app.pressing ? 1 : 0.85;
  // centred on the hand, not its fingertip
  const hh = HANDS[handShown] || HANDS.open, ox = (0.5 - hh[1]) * HAND_PX, oy = (0.5 - hh[2]) * HAND_PX;
  ringEl.style.transform = `translate3d(${pointer.sx + ox}px, ${pointer.sy + oy}px, 0) scale(${sc})`;
  // the fist trembles and tightens as the cookie gets closer to snapping
  const T = app.state === 'idle' ? app.tension : 0;
  const tr = app.pressing ? (0.6 + 4.5 * T * T) * motion : 0;
  handSX = tr ? (Math.random() * 2 - 1) * tr : 0; handSY = tr ? (Math.random() * 2 - 1) * tr : 0;
  handGlyph.style.scale = app.pressing ? String(0.9 - 0.12 * T) : '';
  if (fineHand) placeHand();
  ringFill.style.strokeDashoffset = `${RING_C * (1 - app.tension)}`;
}

let last = performance.now();
function frame(now) {
  const rdt = Math.min((now - last) / 1000, 1 / 30); last = now;
  app.timeScale = damp(app.timeScale, 1, app.state === 'cracked' && app.stateT < 0.12 ? 0.5 : 3.2, rdt);
  const dt = rdt * app.timeScale;
  app.time += dt; app.stateT += rdt;

  updateCamera(rdt);
  updateCookie(dt, rdt);
  if (app.state === 'cracked' || app.state === 'leaving') {
    updateBodies(dt);
    glow.intensity = damp(glow.intensity, 0, 4, rdt);
    if (app.state === 'cracked' && app.stateT > 1.5 && !againEl.classList.contains('show')) {
      againEl.classList.add('show');
      if (!app.flipHinted && app.cracks === 1) { showHint('tap the fortune to turn it over', true); setTimeout(() => { if (app.state === 'cracked') showHint(null, false); }, 3800); }
    }
    if (app.state === 'cracked' && app.stateT > 1.5 && hintEl.classList.contains('show')) againEl.style.bottom = '';
  }
  if (app.state === 'leaving') {
    const k = smooth(0, 0.55, app.stateT);
    for (const b of app.bodies) b.mesh.scale.setScalar(b.s * (1 - k) + 1e-4);
    for (const cr of crumbs) cr.k = 1 - smooth(0, 0.5, app.stateT - cr.p.x * 0.05 - 0.05);
    if (app.stateT > 0.65) { for (const b of app.bodies) { b.mesh.removeFromParent(); } crumbs.length = 0; returnToPile(); }
  }
  updatePile(dt);
  updatePicked(rdt);
  updateLitter(dt);
  updateSlip(dt, rdt);
  updateCrumbs(dt, app.time);
  updatePuff(dt);
  updateMotes(rdt, app.time);
  updateRing(rdt);
  if (AUTO && app.state === 'idle' && app.stateT > 0.6 && !app.pressing && app.cracks === 0) beginPress();
  if (AUTO) document.body.dataset.dbg = JSON.stringify({ s: app.state, T: +app.tension.toFixed(2), t: +app.time.toFixed(2), b: app.bodies.map((b) => [b.p.x, b.p.y, b.p.z].map((v) => +v.toFixed(2)).concat(b.asleep)), slip: [slip.pos.x, slip.pos.y, slip.pos.z, slip.scale.x].map((v) => +v.toFixed(2)), cr: crumbs.length });
  breakMat.visible = breakMatT.visible = app.state === 'cracked' || app.state === 'leaving' || app.tension > 0.02;
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------ boot */
layout();
cam.dist = cam.distGoal;
(async () => {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('italic 500 100px "Cormorant Garamond"'),
        document.fonts.load('500 100px "Cormorant Garamond"'),
        document.fonts.load('600 100px "Cormorant Garamond"'),
      ]),
      new Promise((r) => setTimeout(r, 2500)),
    ]);
  } catch (e) {}
  drawSlip(nextFortune());
  buildPile();
  setState('pile'); setCamView('pile');
  cam.dir.copy(cam.dirGoal); cam.target.copy(cam.targetGoal); cam.dist = cam.distGoal;
  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => canvas.classList.add('ready'));
})();
window.__fc = { app, packs, pickPack, tear, snap, flipSlip, another, camera, scene, slip, crumbs, beginPress, endPress,
  step(n = 1, ms = 1000 / 60) { for (let i = 0; i < n; i++) frame(last + ms); } };
</script>
</body>
